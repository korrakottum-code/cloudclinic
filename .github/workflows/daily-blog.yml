name: Publish daily blog article

on:
  schedule:
    - cron: "7 16 * * *" # 23:07 Asia/Bangkok
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish next ready article
        id: publish
        run: |
          set -e
          OUTPUT="$(node scripts/publish-next.js)"
          echo "$OUTPUT"
          {
            echo "output<<PUBLISH_EOF"
            echo "$OUTPUT"
            echo "PUBLISH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: contains(steps.publish.outputs.output, 'PUBLISHED')
        run: npm run build

      - name: Commit and push
        if: contains(steps.publish.outputs.output, 'PUBLISHED')
        run: |
          git config user.name "cloudclinic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/ content/blog-calendar.json public/sitemap.xml vite.config.js
          git commit -m "Publish daily blog article (automated)"
          git push

      # Pushes made with the default GITHUB_TOKEN don't trigger other workflows (GitHub's
      # loop-prevention rule), so deploy.yml would never fire on its own here — this job
      # deploys directly instead of depending on that.
      - name: Setup Pages
        if: contains(steps.publish.outputs.output, 'PUBLISHED')
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: contains(steps.publish.outputs.output, 'PUBLISHED')
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        if: contains(steps.publish.outputs.output, 'PUBLISHED')
        id: deployment
        uses: actions/deploy-pages@v4
